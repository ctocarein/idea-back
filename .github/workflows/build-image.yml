# Build & push de l'image Docker (api + worker : une seule image) vers GHCR.
# SOURCE UNIQUE de build : appelé par deploy.yml (workflow_call) sur develop/main,
# et déclenchable seul sur un tag `v*` ou à la main (workflow_dispatch).
#
# Tags produits sur ghcr.io/<owner>/idea-back :
#   - <branche>        develop, main — suit la tête de branche
#   - <sha complet>    immuable — consommé par les compose (déploiement, rollback)
#   - X.Y.Z et X.Y     sur tag git `vX.Y.Z` — releases
#   - latest           sur main uniquement (branche de production)

name: Build image → GHCR

on:
  workflow_call:
    outputs:
      image:
        description: "Référence immuable de l'image poussée (tag = sha complet)"
        value: ${{ jobs.build-push.outputs.image }}
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/idea-back

jobs:
  build-push:
    name: Build & push → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    # Un seul build à la fois par ref ; un push plus récent annule le build en cours.
    # Au niveau job : le `concurrency` de niveau workflow est ignoré via workflow_call.
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Buildx : requis pour le cache de couches en mode registre (mode=max).
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MY_GITHUB_TOKEN }}

      # Tags + labels OCI générés depuis l'événement. `prefix=` vide sur le sha
      # → tag = sha complet nu, consommé tel quel par les compose.
      - name: Métadonnées image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Référence immuable exposée au workflow appelant (deploy.yml).
      - name: Référence image (sha)
        id: ref
        run: echo "image=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Cible VPS x86 ; pas d'arm64 — l'installation de Chromium (export deck)
          # doublerait le temps de build sous QEMU pour rien.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de couches poussé dans le registre : fiable pour une image lourde
          # (WeasyPrint + Chromium), contrairement au cache GHA plafonné à 10 Go.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
