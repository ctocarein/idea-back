[project]
name = "ideaxion-backend"
version = "0.1.0"
description = "Ideaxion — backend FastAPI (MVP freemium). Moteur de transformation : diagnostic, Radar, academy, simulateur de pitch."
readme = "README.md"
requires-python = ">=3.12"

# Dépendances de production. Principe : peu de dépendances, bien choisies (archi backend §15).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "httpx>=0.28",
    "minio>=7.2",
    "structlog>=24.4",
    "python-multipart>=0.0.9",  # upload multipart (pitch decks)
]

[project.optional-dependencies]
# Outillage de dev : tests, lint, typage. Installé via `uv sync --extra dev`.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Génération PDF du bilan (WeasyPrint). `uv sync --extra pdf`.
# NB : WeasyPrint requiert des libs système (pango, cairo) sur l'hôte/conteneur.
pdf = [
    "weasyprint>=63.0",
]
# Parsing + rendu des pitch decks (PITCH-02). `uv sync --extra pitch`.
# pypdfium2 = PDFium embarqué (binaire), zéro lib système → rend les slides en images
# (présentation nette + vision multimodale). Pillow encode les PNG.
pitch = [
    "pypdf>=4.0",
    "python-pptx>=0.6",
    "pypdfium2>=4.30",
    "pillow>=10.0",
]
# Rendu du deck de pitch visuel (V1.3) : Chromium headless pour convertir le
# HTML/CSS/Chart.js du deck en PDF (page.pdf()) et en images (1 PNG/slide →
# PPTX). `uv sync --extra deck` puis `playwright install chromium`.
deck = [
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# Lint rapide + format. Cible la même version que requires-python.
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Sélection raisonnable : erreurs, pyflakes, imports, bugbear, upgrade.
select = ["E", "F", "I", "B", "UP", "W"]
ignore = [
    "B008",   # Depends(...) en argument par défaut = l'idiome FastAPI (voulu)
    "B905",   # zip() sans strict= : non requis ici
    "UP042",  # `class X(str, Enum)` est intentionnel (compat large, lisible)
    "UP046",  # générique Generic[T] explicite conservé (modèles Pydantic)
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Templates embarqués (CSS/HTML, schémas JSON, URLs) : lignes longues légitimes.
"app/reports/pdf.py" = ["E501"]
"app/llm/prompt.py" = ["E501"]
"tests/integration/conftest.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Baseline pragmatique : on attrape les vraies incompatibilités de types (corps des
# fonctions, casts inutiles) sans le flot du mode `strict` sur un code riche en JSONB
# (dict/list non paramétrés) et en callables `Depends`. Objectif : durcir incrémentalement
# (réactiver disallow_untyped_defs puis disallow_any_generics module par module).
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: nécessite un Postgres accessible (variable TEST_DATABASE_URL) — sinon ignoré",
]
