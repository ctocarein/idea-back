# Stack staging complète : PostgreSQL · Redis · MinIO · API · Front · Nginx
#
# Sur le VPS :
#   cp .env.staging.example .env.staging
#   nano .env.staging               # remplir les secrets
#   ./scripts/deploy-staging.sh     # ou via GitHub Actions
#
# Images tirées depuis GHCR (pré-buildées par CI), pas de build sur le serveur.

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://ideaxion:${POSTGRES_PASSWORD:?}@postgres:5432/ideaxion
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_SECURE: "false"

services:
  # ── Données ────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ideaxion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ideaxion
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideaxion"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Migration (one-shot, s'arrête seul) ────────────────────────────────────

  migrate:
    image: ${BACK_IMAGE:-ghcr.io/ctocarein/idea-back:staging}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    env_file: .env.staging
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  # ── Application ────────────────────────────────────────────────────────────

  api:
    image: ${BACK_IMAGE:-ghcr.io/ctocarein/idea-back:staging}
    restart: unless-stopped
    command:
      - uv
      - run
      - gunicorn
      - app.main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "2"
      - -b
      - "0.0.0.0:8080"
    env_file: .env.staging
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  front:
    image: ${FRONT_IMAGE:-ghcr.io/ctocarein/idea-front:staging}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Appels BFF → API via le réseau Docker interne (pas par l'extérieur)
      BACKEND_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  # ── Reverse-proxy ──────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - front
      - api

  # Renouvellement SSL automatique (Let's Encrypt) — tourne en tâche de fond
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

volumes:
  pg_data:
  redis_data:
  minio_data:
  certbot_conf:
  certbot_www:
