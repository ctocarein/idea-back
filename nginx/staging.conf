# Nginx staging — 2 sous-domaines :
#   staging.ideaxion.cloud  → Next.js (front:3000)
#   api.staging.ideaxion.cloud → FastAPI (api:8080)
#
# Avant de démarrer avec HTTPS, obtenir les certificats :
#   docker compose -f docker-compose.staging.yml run --rm certbot certonly \
#     --webroot -w /var/www/certbot \
#     -d staging.ideaxion.cloud -d api.staging.ideaxion.cloud \
#     --email support@ideaxion.cloud --agree-tos --non-interactive

# ── Redirect HTTP → HTTPS ───────────────────────────────────────────────────

server {
    listen 80;
    server_name staging.ideaxion.cloud api.staging.ideaxion.cloud;

    # Challenge Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend (Next.js) ──────────────────────────────────────────────────────

server {
    listen 443 ssl;
    server_name staging.ideaxion.cloud;

    ssl_certificate     /etc/letsencrypt/live/staging.ideaxion.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ideaxion.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (6 mois, staging donc no includeSubDomains)
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://front:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Backend (FastAPI) ───────────────────────────────────────────────────────

server {
    listen 443 ssl;
    server_name api.staging.ideaxion.cloud;

    ssl_certificate     /etc/letsencrypt/live/staging.ideaxion.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ideaxion.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Timeout généreux pour les appels LLM (extraction/scoring)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
